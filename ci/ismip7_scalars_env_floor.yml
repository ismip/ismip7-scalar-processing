# The oldest dependency versions the package supports: every floor in
# ismip7_scalars_env.yml that the processing itself needs, pinned exactly.  CI
# runs the test suite against this environment as well as the latest solve, so
# both ends of every range in ismip7_scalars_env.yml are actually verified
# rather than assumed.  The documentation packages are left out: nothing here
# runs the docs build, and CI builds them from ci/docs_env.yml.
#
# Keep this file in step with ismip7_scalars_env.yml: when a floor moves there,
# move it here too.
name: ismip7-scalars
channels:
  - conda-forge
  - nodefaults

dependencies:
  - python =3.11
  - pip
  - setuptools >=77

  - numpy =2.1
  - netcdf4 =1.7

  - isschecker =0.2

  - pytest =8
